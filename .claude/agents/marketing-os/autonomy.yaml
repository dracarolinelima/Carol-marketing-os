    level: C
    max_level: B

  # ----------------------------------------------------------
  # QUALITY CONTROL
  # The Editor may become more autonomous in detecting and
  # correcting low-risk issues, but cannot replace human
  # medical approval where required.
  # ----------------------------------------------------------

  perform_editorial_review:
    owner: mos-editor
    level: C
    max_level: B

  correct_brand_style_issue:
    owner: mos-editor
    level: C
    max_level: B

  flag_medical_claim:
    owner: mos-editor
    level: C
    max_level: B

  request_scientific_reverification:
    owner: mos-editor
    level: C
    max_level: B

  # ----------------------------------------------------------
  # VISUAL DIRECTION
  # ----------------------------------------------------------

  produce_visual_direction:
    owner: mos-art-director
    level: C
    max_level: B

  apply_approved_design_system:
    owner: mos-art-director
    level: C
    max_level: B

  recommend_template:
    owner: mos-art-director
    level: C
    max_level: B

  # ==========================================================
  # PERMANENT HUMAN GATES
  #
  # These decisions do NOT graduate automatically.
  # ==========================================================

