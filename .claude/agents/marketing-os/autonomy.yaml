# Carol Marketing OS - Autonomy Configuration
# Version: 1.0
# Status: Human-supervised deployment
#
# LEVELS
# C = Draft / Recommend + Wait for human approval
# B = Execute low-risk internal decision + report
# A = Autonomous execution within explicitly approved boundaries
#
# IMPORTANT:
# Autonomy graduates by DECISION TYPE, not by agent as a whole.
# Success in one decision type never grants autonomy in another.

agent: marketing-os
current_phase: human_supervised

strategic_authority: memory/carol-marketing-os/marketing-core.md

# ============================================================
# DECISION-SPECIFIC AUTONOMY
# ============================================================

decision_levels:

  # ----------------------------------------------------------
  # ORCHESTRATION / ROUTING
  # May graduate with demonstrated reliability.
  # ----------------------------------------------------------

  route_internal_audience_research:
    owner: mos-orchestrator
    level: C
    max_level: A

  route_external_market_research:
    owner: mos-orchestrator
    level: C
    max_level: A

  route_scientific_research:
    owner: mos-orchestrator
    level: C
    max_level: A

  route_strategy:
    owner: mos-orchestrator
    level: C
    max_level: A

  route_creation:
    owner: mos-orchestrator
    level: C
    max_level: A

  route_editorial_review:
    owner: mos-orchestrator
    level: C
    max_level: A

  route_visual_direction:
    owner: mos-orchestrator
    level: C
    max_level: A

  route_performance_analysis:
    owner: mos-orchestrator
    level: C
    max_level: A

  select_minimum_sufficient_workflow:
    owner: mos-orchestrator
    level: C
    max_level: B

  # ----------------------------------------------------------
  # RESEARCH / ANALYSIS
  # Internal analytical work may gradually become more
  # autonomous, but conclusions remain constrained by
  # evidence quality and source hierarchy.
  # ----------------------------------------------------------

  analyze_internal_audience_data:
    owner: mos-audience-intelligence
    level: C
    max_level: B

  produce_audience_findings:
    owner: mos-audience-intelligence
    level: C
    max_level: B

  analyze_external_market:
    owner: mos-market-research
    level: C
    max_level: B

  produce_market_research:
    owner: mos-market-research
    level: C
    max_level: B

  retrieve_scientific_evidence:
    owner: mos-scientific-research
    level: C
    max_level: B

  summarize_scientific_evidence:
    owner: mos-scientific-research
    level: C
    max_level: B

  classify_evidence_strength:
    owner: mos-scientific-research
    level: C
    max_level: B

  analyze_marketing_performance:
    owner: mos-performance-analyst
    level: C
    max_level: B

  classify_performance_finding:
    owner: mos-performance-analyst
    level: C
    max_level: B

  recommend_performance_test:
    owner: mos-performance-analyst
    level: C
    max_level: B

  # ----------------------------------------------------------
  # STRATEGY
  # Strategy remains supervised during the current phase.
  # ----------------------------------------------------------

  create_content_strategy:
    owner: mos-strategist
    level: C
    max_level: B

  create_creative_brief:
    owner: mos-strategist
    level: C
    max_level: B

  select_content_function:
    owner: mos-strategist
    level: C
    max_level: B

  select_journey_stage:
    owner: mos-strategist
    level: C
    max_level: B

  recommend_content_format:
    owner: mos-strategist
    level: C
    max_level: B

  recommend_cta_logic:
    owner: mos-strategist
    level: C
    max_level: B

  # ----------------------------------------------------------
  # CREATION
  # Draft generation may improve operational autonomy,
  # but external use remains human-approved.
  # ----------------------------------------------------------

  produce_content_draft:
    owner: mos-copywriter
    level: C
    max_level: B

  revise_content_from_feedback:
