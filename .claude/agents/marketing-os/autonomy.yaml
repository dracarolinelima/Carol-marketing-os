# ============================================================
# GRADUATION TRACKING
# ============================================================

tracking:

  principle: decision_specific

  global_totals:
    recommendations_reviewed: 0
    approved_without_change: 0
    approved_with_minor_change: 0
    materially_revised: 0
    rejected: 0

  tracking_started: null

  decision_history: {}

# ============================================================
# GRADUATION RULES
# ============================================================

graduation_rules:

  general:
    automatic_graduation: false
    human_confirmation_required: true
    evaluate_each_decision_type_separately: true

  c_to_b:
    min_reviewed_decisions: 20
    min_days_tracking: 14
    min_approved_without_material_change_rate: 85
    max_material_failures_last_10: 0
    requires_human_confirmation: true

  b_to_a:
    eligible_only_when_max_level_is_A: true
    min_reviewed_decisions_on_B: 30
    min_days_on_B: 28
    min_approved_without_material_change_rate: 95
    max_material_failures_last_20: 0
    requires_human_confirmation: true

# ============================================================
# WHAT COUNTS AS A MATERIAL FAILURE
# ============================================================

material_failure_examples:

  - unsupported factual claim
  - fabricated source or evidence
  - material scientific misrepresentation
  - association presented as causality
  - incorrect audience conclusion from internal data
  - incorrect funnel classification affecting a business decision
  - use of Cliente IO AI classification as ground truth
  - attendance inferred without authoritative evidence
  - revenue inferred from quoted price or unverified payment
  - material violation of Marketing Core
  - material brand or positioning violation
  - privacy violation
  - bypass of required human approval
  - unauthorized external action
  - unauthorized budget change

# ============================================================
# NON-MATERIAL EDITS
# ============================================================

non_material_edit_examples:

  - punctuation preference
  - minor wording preference
  - small rhythm improvement
  - formatting cleanup
  - equivalent CTA wording
  - cosmetic visual adjustment within approved system

# ============================================================
# AUTONOMY BOUNDARIES
# ============================================================

boundaries:

  evidence:
    never_fabricate: true
    preserve_uncertainty: true
    distinguish_fact_association_hypothesis_decision: true

  medical:
    scientific_research_does_not_replace_clinical_judgment: true
    patient_specific_decisions_require_human: true

  performance:
    cliente_io_ai_labels_are_ground_truth: false
    crm_booking_does_not_prove_attendance: true
    quoted_price_does_not_prove_revenue: true
    missing_data_does_not_equal_zero: true

  strategy:
    agents_may_not_autonomously_rewrite_marketing_core: true
    performance_findings_do_not_automatically_become_rules: true

  external_actions:
    publish_requires_human: true
    send_requires_human: true
    budget_change_requires_human: true
    campaign_launch_requires_human: true

  privacy:
    minimize_patient_data: true
    prefer_anonymized_data: true
    unnecessary_pii_in_persistent_memory_forbidden: true

# ============================================================
# LEVEL CHANGE HISTORY
# ============================================================

level_changes:

  - date: 2026-09-09
    decision_type: system_initialization
    from: null
    to: C
    reason: "Carol Marketing OS human-supervised deployment"

# ============================================================
# UPDATE INSTRUCTIONS
# ============================================================

# After a reviewed decision:
#
# 1. Identify the exact decision type.
# 2. Record the outcome for THAT decision type.
# 3. Distinguish:
#      approved_without_change
#      approved_with_minor_change
#      materially_revised
#      rejected
# 4. Do not combine unrelated decision types to justify graduation.
# 5. Reaching numerical thresholds does NOT automatically change level.
# 6. Human confirmation is required before every level change.
# 7. Decisions marked permanent_human_gate never graduate.
#
# The purpose of autonomy is to reduce unnecessary supervision
# without reducing scientific, strategic, ethical or business quality.
